<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kebbi 居家復健家屬監控網頁</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 700px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 20px; }
    .cards { display: flex; gap: 15px; margin-bottom: 20px; }
    .card { flex: 1; background: white; padding: 15px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card h3 { margin: 0; font-size: 14px; color: #666; }
    .card .num { font-size: 26px; font-weight: bold; color: #007bff; margin-top: 8px; }
    .table-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #fafafa; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>🤖 Kebbi 居家復健即時監控</h2>
      <p>家屬遠端查看儀表板</p>
    </div>

    <div class="cards">
      <div class="card"><h3>累積復健次數</h3><div class="num" id="total-count">-- 次</div></div>
      <div class="card"><h3>歷史平均正確率</h3><div class="num" id="avg-acc">-- %</div></div>
    </div>

    <div class="table-card">
      <h3>復健與滿意度歷史紀錄</h3>
      <table>
        <thead>
          <tr><th>時間</th><th>患者</th><th>正確率</th><th>滿意度</th></tr>
        </thead>
        <tbody id="list">
          <tr><td colspan="4">載入中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // ⚠️ 請把下面這行換成你第一階段取得的 Google API 網址！
    const API_URL = "https://script.google.com/macros/s/你的_GAS_DEPLOY_ID/exec";

    async function loadData() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        
        document.getElementById('total-count').innerText = data.total_sessions + " 次";
        document.getElementById('avg-acc').innerText = data.avg_accuracy + " %";
        
        let html = "";
        data.records.forEach(r => {
          html += `<tr>
            <td>${r.time}</td>
            <td>${r.name}</td>
            <td><strong>${r.accuracy}%</strong></td>
            <td>${r.satisfaction} ★</td>
          </tr>`;
        });
        document.getElementById('list').innerHTML = html || "<tr><td colspan='4'>尚無紀錄</td></tr>";
      } catch (err) {
        console.error(err);
      }
    }

    loadData();
    setInterval(loadData, 5000); // 每 5 秒自動刷新一次
  </script>
</body>
</html>
