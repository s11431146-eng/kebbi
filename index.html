<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>居家復健即時監控儀表板</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 24px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    .card h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #6b7280;
    }
    .card .value {
      font-size: 24px;
      font-weight: bold;
      color: var(--primary);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 14px 16px;
      text-align: left;
    }
    th {
      background-color: #e0e7ff;
      color: #3730a3;
      font-weight: 600;
    }
    tr:nth-child(even) {
      background-color: #f9fafb;
    }
    .stars {
      color: #f59e0b;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🤖 Kebbi 居家復健即時監控儀表板</h1>

  <!-- 頂部數據卡片 -->
  <div class="stats-grid">
    <div class="card">
      <h3>目前紀錄患者</h3>
      <div class="value" id="latest-patient">載入中...</div>
    </div>
    <div class="card">
      <h3>累積復健次數</h3>
      <div class="value" id="total-count">0 次</div>
    </div>
    <div class="card">
      <h3>最新滿意度</h3>
      <div class="value stars" id="latest-satisfaction">-</div>
    </div>
  </div>

  <!-- 歷史紀錄表格 -->
  <div class="card">
    <h3 style="font-size: 18px; color: var(--text); margin-bottom: 16px;">📋 即時復健紀錄歷史</h3>
    <table>
      <thead>
        <tr>
          <th>時間</th>
          <th>患者姓名</th>
          <th>復健部位 / 動作</th>
          <th>滿意度評分</th>
        </tr>
      </thead>
      <tbody id="record-table-body">
        <tr>
          <td colspan="4" style="text-align:center; color:#9ca3af;">資料同步中...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // ⚠️ 請填入您的 Google Apps Script Web App 網址 (/exec 結尾)
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxHPp8fOmtefATd-Tkxbz0eburgYSxd4mrAkaOON8tZA6JyjrgO2C5G9T0YPZW7XDSYeQ/exec";

  async function fetchDashboardData() {
    try {
      const response = await fetch(GAS_API_URL);
      const data = await response.json();
      
      if (data && data.length > 0) {
        // 1. 更新頂部摘要卡片 (抓最後一筆)
        const latest = data[data.length - 1];
        document.getElementById("latest-patient").innerText = latest.patient_name || "無資料";
        document.getElementById("total-count").innerText = `${data.length} 次`;
        document.getElementById("latest-satisfaction").innerText = "⭐".repeat(latest.satisfaction || 5);

        // 2. 更新歷史紀錄表格 (反轉陣列，最新紀錄排最上面)
        const tbody = document.getElementById("record-table-body");
        tbody.innerHTML = "";

        data.slice().reverse().forEach(row => {
          const tr = document.createElement("tr");
          
          // 格式化時間 (如果 GAS 沒有回傳時間，自動預設)
          const timeStr = row.timestamp ? new Date(row.timestamp).toLocaleString("zh-TW") : "剛才";
          const starsStr = "⭐".repeat(row.satisfaction || 5);

          tr.innerHTML = `
            <td>${timeStr}</td>
            <td><strong>${row.patient_name}</strong></td>
            <td>${row.action_name || row.body_part || "肩關節練習"}</td>
            <td class="stars">${starsStr} (${row.satisfaction || 5}分)</td>
          `;
          tbody.appendChild(tr);
        });
      }
    } catch (error) {
      console.error("無法抓取資料:", error);
    }
  }

  // 初次載入與每 5 秒自動輪詢更新
  fetchDashboardData();
  setInterval(fetchDashboardData, 5000);
</script>

</body>
</html>
